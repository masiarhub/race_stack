# Opponent: the race stack time trials stack, blind to the ego, following one of the global lines
# at a reduced, sampled speed.
name: opp_tt_raceline
kind: launch
launch: {package: stack_master, file: time_trials_launch.xml}
args:
  sim_opp: true
  racecar_version: SIM
  ctrl_algo: MAP
  raceline: {choice: [mincurv, shortest_path]}
params:
  /opp_racecar/sector_tuner:
    global_limit: {uniform: [0.25, 0.4], step: 0.01}  # fraction of the raceline speed profile (the ego runs at 0.5)
