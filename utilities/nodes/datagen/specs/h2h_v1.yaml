# First head-to-head dataset: ego = race stack h2h stack, opponents = three policy types.
name: h2h_v1
seed: 42
episodes: 12                 # assigned round robin over (track, opponent policy)

tracks: [glc_ot_ez]

ego:
  policy: ego_h2h_spliner

opponents:
  count: 1                   # the gym bridge supports one opponent
  policies:                  # names in the policy search path, or paths to YAML files
    - opp_tt_raceline
    - opp_line_follower
    - opp_blocker

episode:                     # rules of one run, see datagen/spec.py for all fields and defaults
  laps: 2
  spawn_frac: {uniform: [0.0, 1.0]}
  start_gap_m: {uniform: [2.0, 6.0]}
  warmup_s: 2.0
  timeout_s: 120.0
  decouple: {gap_m: 15.0, duration_s: 5.0}

dataset:                     # applied offline by `ros2 run datagen extract`, no re-simulation needed
  dt: 0.05
  frame: frenet              # frenet | cartesian
  reference: centerline      # centerline | raceline | shortest_path
  opp_source: tracker        # x from the ego's tracker (tracker) or the sim ground truth (gt)
  features:
    - rel_pos                # delta_s, delta_d
    - opp_d
    - opp_vel                # vs, vd
    - ego_vel
    - curvature: {n: 10, step_m: 0.5}
  labels: {type: action, horizon: 1}   # state_delta | state | action
  history: 1
